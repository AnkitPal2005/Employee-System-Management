<div class="dashboard-container">

  <h1 class="title">Dashboard Overview</h1>

  <div class="cards">

    <mat-card class="card blue">
      <h2>Total Employees</h2>
      <p class="number">{{ totalEmployees }}</p>
    </mat-card>

    <mat-card class="card green">
      <h2>System Status</h2>
      <p class="number">Active</p>
    </mat-card>

    <mat-card class="card purple">
      <h2>Database</h2>
      <p class="number">PostgreSQL</p>
    </mat-card>

  </div>

</div>
