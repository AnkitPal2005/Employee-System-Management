<mat-toolbar color="primary">
  <h1 id="heading">Employee Management</h1>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="openAddDialog()" id="Add">Add Employee</button>
  <div class="bulk-bar" *ngIf="selection.selected.length > 0">
  {{selection.selected.length}} employee(s) selected

  <button id="ds" mat-raised-button color="warn"
          (click)="deleteSelected()">
    Delete Selected
  </button>
</div>
</mat-toolbar>
<mat-form-field appearance="outline" style="width:300px; margin:10px;">
  <!-- <mat-label>Search Employee</mat-label> -->
  <input matInput (keyup)="onSearch($event)" placeholder="Search Name or Email">
</mat-form-field>
<mat-card>
 <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5,10,20,50,100,1000]"
    [showFirstLastButtons]="true"
    (page)="onPageChange($event)">
  </mat-paginator>

  <table mat-table [dataSource]="employees" class="mat-elevation-z8">
<ng-container matColumnDef="select">
  <th mat-header-cell *matHeaderCellDef>
    Mark-All
  <mat-checkbox
      (change)="toggleAll($event)"
      [checked]="selection.selected.length === employees.length">
  </mat-checkbox>
</th>

  <td mat-cell *matCellDef="let row">
  <mat-checkbox
      (click)="$event.stopPropagation()"
      (change)="selection.toggle(row)"
      [checked]="selection.isSelected(row)">
  </mat-checkbox>
</td>
</ng-container> 
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let emp">{{ emp.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let emp">{{ emp.email }}</td>
    </ng-container>

    <ng-container matColumnDef="salary">
      <th mat-header-cell *matHeaderCellDef>Salary</th>
      <td mat-cell *matCellDef="let emp">{{ emp.salary }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let emp">
        <button mat-icon-button color="primary" (click)="edit(emp)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(emp.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>

 
</mat-card>
